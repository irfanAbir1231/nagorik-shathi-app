name: Cloudflare deployment

# PAUSED: this no longer runs on push or pull request.
#
# It failed on every push because the Cloudflare build tool (OpenNext) refuses
# Next.js 15, whose 2-year support window ended in Oct 2026, and there is no
# hosting target or CLOUDFLARE_API_TOKEN secret in this repository yet.
#
# To bring it back: upgrade Next.js to a supported version, add the secret and
# the `production` environment, then restore these triggers:
#   pull_request:
#   push:
#     branches: [main]
# Until then it can still be started by hand (Actions > Cloudflare deployment > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Cloudflare bundle
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: https://build.invalid

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare bundle
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: https://build.invalid

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
